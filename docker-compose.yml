version: "3.4"

services:
  authentication-api:
    build:
      context: ./Authentication.API
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGO_DB_URI=mongodb://admin:secret@mongo:27017/bdimage?authSource=admin
    networks:
      - backend
    depends_on:
      - mongo

  simulation-api:
    build:
      context: ./Simulation.API
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - backend
    depends_on:
      - mongo

  chatbot-api:
    build:
      context: ./Chatbot.API
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - backend
    depends_on:
      - mongo

  notification-api:
    build:
      context: ./Notification.API
      dockerfile: Dockerfile
    ports:
      - "4007:4007"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - backend
    depends_on:
      - mongo

  credit-api:
    build:
      context: ./Credit.API
      dockerfile: Dockerfile
    ports:
      - "4011:4011"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGO_DB_URI=mongodb://admin:secret@mongo:27017/bdcredit?authSource=admin
      - NOTIFICATION_API_URL=http://notification-api:4007
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
    networks:
      - backend
    depends_on:
      - mongo
      - rabbitmq

  declaration-api:
    build:
      context: ./Declaration.API
      dockerfile: Dockerfile
    ports:
      - "4008:4008"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - NOTIFICATION_API_URL=http://notification-api:4007
    networks:
      - backend
    depends_on:
      - mongo

  depotdocuments-api:
    build:
      context: ./DepotDocuments.API
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - NOTIFICATION_API_URL=http://notification-api:4007
      - AZURE_OCR_KEY=CWmrKycUIzyqxwKOCZBlySPWTuQAaJHtNERiCgFZGbicDF6xnFOiJQQJ99BEAC5T7U2XJ3w3AAAFACOG5VUz
      - AZURE_OCR_ENDPOINT=https://ocr-pfe-service.cognitiveservices.azure.com/
      - RABBITMQ_URI=amqp://guest:guest@rabbitmq:5672/
    networks:
      - backend
    depends_on:
      - mongo
      - rabbitmq

  validation-api:
    build:
      context: ./Validation.API
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - NOTIFICATION_API_URL=http://notification-api:4007
    networks:
      - backend
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - backend
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
